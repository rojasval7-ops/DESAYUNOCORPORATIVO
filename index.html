<style>
:root{
  --blau:#004D98; --blau-deep:#00224A; --grana:#A50044; --gold:#EDBB00;
  --bg:#F3F6FB; --surface:#FFFFFF; --surface-2:#E7EDF6; --text:#0E1B2E; --muted:#56667D; --line:#D3DCE8;
  --accent:#004D98; --ok:#1C7F46; --danger:#B3123E; --gris:#8A95A8;
  --display:'Bebas Neue', Impact, 'Arial Narrow', sans-serif;
  --body:'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#06142A; --surface:#0D2142; --surface-2:#163056; --text:#EEF2F8; --muted:#9CABC2; --line:#26446F;
    --accent:#6FB0F5; --ok:#55C987; --danger:#FF6B92; --gris:#5E6C84;
    color-scheme: dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
a{color:var(--accent)}
.wrap{width:min(1080px,100% - 40px);margin-inline:auto}

/* ---------- Capçalera ---------- */
.top{background:var(--blau-deep);color:#fff;border-bottom:3px solid var(--grana)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:84px}
.brand{display:inline-flex;align-items:center;line-height:0;border-radius:6px}
.brand img{display:block;height:58px;width:auto}
.brand:focus-visible{outline:3px solid var(--gold);outline-offset:4px}
.lang{display:flex;gap:2px;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:3px}
.lang button{appearance:none;font:inherit;font-size:13px;font-weight:700;letter-spacing:.04em;background:none;border:0;color:#C9D6EA;border-radius:999px;padding:6px 11px;cursor:pointer;line-height:1}
.lang button[aria-pressed="true"]{background:#fff;color:var(--blau-deep)}
.lang button:hover:not([aria-pressed="true"]){color:#fff}
.lang button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.demo-banner{background:var(--gold);color:#1a1300;font-size:14px;padding:8px 20px;text-align:center}

.hero h1{font-family:'FCB Modernista',Georgia,serif;font-weight:600;font-size:clamp(60px,11.5vw,132px);line-height:.92;margin:0;letter-spacing:-.005em}
.hero .lead{max-width:34em;font-size:clamp(17px,2.2vw,19px);margin:22px 0 0;color:#DCE6F5}
.hero .facts{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px;padding:0;list-style:none}
.hero .facts li{border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:6px 14px;font-size:14px;color:#fff}

/* ---------- Passos ---------- */
.step{display:flex;align-items:center;gap:14px;font-family:var(--display);font-weight:400;font-size:40px;line-height:1;margin:56px 0 22px;letter-spacing:.02em}
.step span{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--grana);color:#fff;font-size:26px;flex:none}
.selected-note{margin:-8px 0 22px;color:var(--muted)}
.selected-note strong{color:var(--text)}

/* ---------- Entrades (dates) ---------- */
.tickets{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr))}
.ticket{appearance:none;font:inherit;color:inherit;text-align:left;display:grid;grid-template-columns:100px 1fr;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0;cursor:pointer;position:relative;
  transition:border-color .15s,box-shadow .15s}
.ticket:hover:not(:disabled){border-color:var(--accent)}
.ticket:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.ticket.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.stub{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--stub,var(--blau));color:var(--stub-ink,#fff);
  border-radius:13px 0 0 13px;padding:18px 8px;position:relative;border-right:2px dashed currentColor}
.stub::before,.stub::after{content:"";position:absolute;right:-12px;width:22px;height:22px;border-radius:50%;background:var(--bg)}
.stub::before{top:-12px}.stub::after{bottom:-12px}
.stub .wd{font-size:12px;opacity:.85}
.stub .day{font-family:var(--display);font-size:62px;line-height:.9;margin-top:4px}
.stub .mo{font-family:var(--display);font-size:22px;letter-spacing:.06em;line-height:1}
.tbody{display:flex;flex-direction:column;gap:12px;padding:18px 18px 18px 24px}
.tmeta{display:flex;flex-direction:column;font-size:14px;color:var(--muted)}
.tmeta strong{color:var(--text);font-size:16px}
.tbody>span:not(.tmeta),.ev .occ{display:block}
.bar{display:block;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--blau);border-radius:99px}
.casi .bar i{background:var(--gold)}
.full .bar i{background:var(--grana)}
.aforo-txt{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-top:6px}
.aforo-txt span{color:var(--muted)}
.tcta{font-weight:600;font-size:14px;color:var(--accent)}
.ticket.sel .tcta{color:var(--text)}
.ticket.full{cursor:not-allowed}
.ticket.full .stub{filter:saturate(.5);opacity:.78}
.ttitle{display:block;font-weight:700;font-size:15px;line-height:1.3;color:var(--text);margin-bottom:2px}
.swatches{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sw{position:relative}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw span{display:block;width:34px;height:34px;border-radius:50%;background:var(--c);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer}
.sw input:checked+span{box-shadow:0 0 0 3px var(--text)}
.sw input:focus-visible+span{outline:3px solid var(--gold);outline-offset:3px}
.sw-custom{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--muted)}
.sw-custom input{width:44px;height:34px;padding:0;border:1px solid var(--line);border-radius:8px;background:none;cursor:pointer}
.hint{font-size:13px;color:var(--muted);font-weight:400;margin:6px 0 0}
.preview{max-width:380px}
.preview .ticket{cursor:default}
.att{display:inline-flex;gap:6px;flex-wrap:nowrap}
.att-b{appearance:none;font:inherit;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:4px 10px;cursor:pointer}
.att-b.yes{background:var(--ok);border-color:var(--ok);color:#fff}
.att-b.no{background:var(--danger);border-color:var(--danger);color:#fff}
.att-b:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.txt-card{margin-bottom:14px;padding:20px}
.txt-head{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:12px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--c);vertical-align:-1px;margin-right:8px;box-shadow:0 0 0 1px var(--line)}
.ev-form-grid{display:grid;gap:24px;grid-template-columns:minmax(0,1fr) minmax(260px,380px);align-items:start}
@media (max-width:860px){.ev-form-grid{grid-template-columns:1fr}}
.ticket.full .tcta{color:var(--grana)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:28px;color:var(--muted);margin:0}

/* ---------- Formularis ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:clamp(20px,4vw,36px)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:4px;margin:0 0 22px;background:var(--surface-2)}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;padding:8px 20px;border-radius:999px;font-weight:600;font-size:15px;cursor:pointer;color:var(--muted)}
.seg input:checked+span{background:var(--blau);color:#fff}
.seg input:focus-visible+span{outline:3px solid var(--gold);outline-offset:2px}
.grid{display:grid;gap:16px 20px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
.f input,.f select,.f textarea{font:inherit;font-weight:400;font-size:16px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 13px;width:100%}
.f textarea{min-height:96px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.es-particular .solo-empresa{display:none}
fieldset{border:0;padding:0;margin:0}
.productos{margin-top:26px}
.productos legend,.legend{font-size:14px;font-weight:600;margin-bottom:10px;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;width:1px;height:1px}
.chip span{display:block;border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-size:15px;cursor:pointer;background:var(--bg)}
.chip input:checked+span{background:var(--grana);border-color:var(--grana);color:#fff}
.chip input:focus-visible+span{outline:3px solid var(--gold);outline-offset:2px}
.mt{margin-top:22px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--muted);margin-top:24px}
.check input{margin-top:3px;width:18px;height:18px;accent-color:var(--blau);flex:none}
.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:26px}
.btn{appearance:none;font:inherit;font-weight:600;font-size:16px;border-radius:999px;padding:13px 26px;cursor:pointer;border:2px solid transparent;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn-primary{background:var(--grana);color:#fff}
.btn-primary:hover{background:#8a0039}
.btn-primary:disabled{opacity:.6;cursor:wait}
.btn-ghost{background:transparent;color:var(--accent);border-color:var(--line)}
.btn-sm{font-size:14px;padding:7px 14px}
.form-error{color:var(--danger);font-weight:600;font-size:15px;margin:16px 0 0}
.confirm h3{font-family:var(--display);font-weight:400;font-size:46px;line-height:1;margin:0 0 10px;color:var(--ok)}
.confirm p{margin:0 0 6px;max-width:40em}

/* ---------- Bloc reunió privada ---------- */
.private{background-color:var(--blau-deep);background-image:var(--cuadros);background-size:cover;background-position:center;color:#fff;margin-top:72px;padding:52px 0}
.private-grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))}

.private-card{display:flex;flex-direction:column;align-items:flex-start;border:1px solid rgba(255,255,255,.18);border-top:4px solid var(--grana);border-radius:16px;padding:clamp(24px,4vw,36px);background:rgba(4,18,40,.86);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.private-card.evt{border-top-color:var(--gold)}
.private-card .kicker{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#C9D6EA;margin:0 0 10px}
.private-card h2{font-family:var(--display);font-weight:400;font-size:clamp(34px,4.6vw,46px);line-height:1;margin:0 0 12px}
.private-card p{color:#EEF3FA;margin:0 0 24px}
.private-card .btn{margin-top:auto}
.btn-light{background:#fff;color:var(--blau-deep)}
.btn-light:hover{background:var(--gold)}
#bloqueReunion,#bloqueEvento{padding-bottom:20px}

footer{padding:36px 0 44px;color:var(--muted);font-size:13px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer a{color:var(--muted)}

/* ---------- Admin ---------- */
.admin-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:40px 0 24px}
.admin-head h1{font-family:var(--display);font-weight:400;font-size:clamp(44px,7vw,64px);line-height:.95;margin:0}
.login{max-width:420px;margin:56px auto}
.login h1{font-family:var(--display);font-weight:400;font-size:48px;margin:0 0 6px;line-height:1}
.kpis{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));margin-bottom:26px}
.kpi{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--blau);border-radius:12px;padding:14px 16px}
.kpi:nth-child(2){border-left-color:var(--grana)}.kpi:nth-child(3){border-left-color:var(--gold)}.kpi:nth-child(4){border-left-color:var(--gris)}
.kpi b{display:block;font-family:var(--display);font-weight:400;font-size:34px;line-height:1.05}
.kpi span{font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto}
.tab{appearance:none;font:inherit;font-weight:600;background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--grana)}
.tab:focus-visible{outline:3px solid var(--gold)}
.badge{display:inline-block;font-size:12px;font-weight:600;border-radius:99px;padding:2px 9px;background:var(--surface-2);color:var(--muted)}
.ev{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:12px}
.ev summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(150px,1.2fr) minmax(120px,1fr) minmax(160px,1.4fr) auto;gap:14px;align-items:center;padding:14px 18px}
.ev summary::-webkit-details-marker{display:none}
.ev summary:focus-visible{outline:3px solid var(--gold);border-radius:12px}
.ev .evdate{font-weight:700}
.evsub{font-size:13px;color:var(--muted)}
.ev .occ{font-size:13px;color:var(--muted);margin-top:4px}
.ev.past{opacity:.75}
.ev-body{border-top:1px solid var(--line);padding:16px 18px}
.ev-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:14px}
.mini-chips{display:flex;flex-wrap:wrap;gap:6px}
.subhead{font-size:15px;font-weight:700;color:var(--muted);margin:26px 0 12px}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface-2);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.nowrap{white-space:nowrap}
td select{font:inherit;font-size:13px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.link-danger{appearance:none;background:none;border:0;color:var(--danger);font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:0}
.link-danger:focus-visible{outline:2px solid var(--gold)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.toolbar select{font:inherit;font-size:14px;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.st-pendiente{color:var(--grana);font-weight:600}
@media (max-width:720px){
  .ev summary{grid-template-columns:1fr auto}
  .ev summary .hide-m{display:none}
  .brand img{height:44px}
}

/* ---------- Mòbil ---------- */
td.comment{min-width:200px}
@media (max-width:720px){
  .wrap{width:min(1080px,100% - 32px)}
  .demo-banner{font-size:12px;padding:6px 14px}
  .top .wrap{min-height:68px}
  .lang button{padding:8px 10px}

  .hero{padding:40px 0 48px}
  .hero .lead{margin-top:16px}
  .hero .facts{gap:8px;margin-top:22px}
  .hero .facts li{font-size:13px;padding:5px 12px}

  .step{font-size:30px;gap:12px;margin:40px 0 18px}
  .step span{width:34px;height:34px;font-size:20px}
  .selected-note{font-size:15px}

  .tickets{gap:14px}
  .ticket{grid-template-columns:84px 1fr}
  .stub{padding:14px 6px}
  .stub .day{font-size:52px}
  .stub .mo{font-size:19px}
  .tbody{padding:14px 14px 14px 20px;gap:10px}
  .aforo-txt strong,.aforo-txt span{white-space:nowrap}

  .card{padding:20px 16px;border-radius:14px}
  .seg{display:flex;width:100%}
  .seg label{flex:1}
  .seg span{text-align:center;padding:10px 12px}
  .chips{gap:8px}
  .chip span{padding:9px 14px;font-size:14px}
  .actions .btn{width:100%}
  .confirm h3{font-size:38px}

  .private{padding:36px 0;margin-top:56px}
  .private-grid{gap:16px}
  .private-card{padding:24px 20px}
  .private-card h2{font-size:32px}
  .private-card .btn{width:100%;border-radius:14px;padding:14px 18px;font-size:15px;line-height:1.35}

  footer .wrap{justify-content:center;text-align:center}

  /* Tauler */
  .admin-head{margin:28px 0 20px;align-items:flex-start}
  .admin-head h1{font-size:42px}
  .admin-head .actions{width:100%}
  .admin-head .actions .btn{flex:1}
  .login{margin:28px auto}
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .kpi{padding:12px 14px}
  .kpi b{font-size:26px}
  .kpi span{font-size:12px;line-height:1.35;display:block}
  .tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;border-bottom:0;overflow:visible}
  .tab{border:1px solid var(--line);border-radius:10px;white-space:normal;text-align:center;padding:10px 8px;font-size:14px;background:var(--surface)}
  .tab[aria-selected="true"]{background:var(--blau);border-color:var(--blau);color:#fff}
  .tab:last-child:nth-child(odd){grid-column:1 / -1}
  .toolbar>*,.toolbar .btn,.ev-tools .btn{width:100%}
  .toolbar label{display:flex;align-items:center;gap:10px}
  .toolbar label select{flex:1}
  .ev summary{padding:14px 16px}
  .ev-body{padding:14px 12px}

  /* Taules convertides en fitxes */
  .table-wrap{border:0;background:none;overflow:visible}
  table.cards,.cards tbody,.cards tr{display:block;width:auto}
  table.cards{width:100%}
  .cards thead{display:none}
  .cards tr{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
  .cards td .badge{justify-self:start}
  .ev-body .cards tr{background:var(--bg)}
  .cards td{display:grid;grid-template-columns:108px minmax(0,1fr);gap:10px;align-items:center;padding:5px 0;border:0;white-space:normal;overflow-wrap:anywhere}
  .cards td::before{content:attr(data-l);font-size:12px;font-weight:600;color:var(--muted)}
  .cards td[data-l=""]{grid-template-columns:1fr}
  .cards td[data-l=""]::before{display:none}
  .cards td.lead{order:-1;font-size:16px;font-weight:700;padding-bottom:8px;margin-bottom:4px;border-bottom:1px solid var(--line)}
  .cards td.acc{padding-top:10px;display:flex;justify-content:flex-end;gap:10px}
  .cards td.comment{min-width:0}
  .cards td select{width:100%;padding:8px 10px;font-size:14px}
  .cards .att{flex-wrap:wrap}
  .cards .link-danger{padding:6px 0}
}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:12px 18px;border-radius:10px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>

const textoPropio = k => { const o = TEXTOS[k]; return o && o[lang] && o[lang].trim() ? o[lang] : null; };
function t(k, v = {}) {
  const fila = I18N[k];
  let s = textoPropio(k) ?? (fila ? fila[IDIOMAS.indexOf(lang)] : k);
  return s.replace(/\{(\w+)\}/g, (_, x) => v[x] ?? '');
}
// Per a textos amb salts de línia (títol principal): el text propi s'escapa i els salts es converteixen en <br>

/* ---------- Utilitats ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const isoLocal = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const hoyISO = () => isoLocal(new Date());
const fecha = (iso, o) => new Date(iso + 'T00:00:00').toLocaleDateString(LOCALES[lang], o);
const fechaLarga = iso => fecha(iso, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
const hora = h => String(h || '').slice(0, 5);
const norm = s => String(s || '').trim().toLowerCase();
const plazas = lista => lista.reduce((s, i) => s + (i.asistentes || 1), 0);
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2));
const cuando = ts => ts ? new Date(ts).toLocaleString(LOCALES[lang], { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const verComercial = c => c === OTRO ? t('other') : (c || '');
const verFranja = f => I18N['fr_' + f] ? t('fr_' + f) : (f || '');

function toast(msg) {
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), 3200);
}
function errCode(code) { const e = new Error(code); e.codigo = code; return e; }
function codigoDe(e) {
  if (!e) return 'DEFAULT';
  if (e.codigo) return e.codigo;
  if (e.code === '23505') return 'DUPLICADO';
  const m = String(e.message || '');
  for (const c of ['INSCRIPCIONES_CERRADAS','PLAZAS_INSUFICIENTES','AFORO_COMPLETO','LIMITE_EMPRESA','DESAYUNO_NO_DISPONIBLE','DESAYUNO_PASADO','NO_ADMIN']) if (m.includes(c)) return c;
  if (/invalid login|invalid credentials/i.test(m)) return 'LOGIN';
  return 'DEFAULT';
}
const mensajeError = code => t('err_' + code, { n: (state.sel && state.sel.max_por_empresa) || CONFIG.MAX_POR_EMPRESA });

function apiSupabase() {
  const sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  const ok = ({ data, error }) => { if (error) throw error; return data; };
  return {
    async disponibles() { return ok(await sb.rpc('desayunos_disponibles')) || []; },
    async inscribir(n) { ok(await sb.from('inscripciones').insert(n)); },
    async unirseEspera(n) { ok(await sb.from('lista_espera').insert(n)); },
    async textos() { return ok(await sb.from('textos').select('*')) || []; },
    async reunion(n) { ok(await sb.from('reuniones').insert(n)); },
    async evento(n) { ok(await sb.from('eventos_privados').insert(n)); },
    async login(email, password) {
      ok(await sb.auth.signInWithPassword({ email, password }));
      const es = ok(await sb.rpc('es_admin'));
      if (!es) { await sb.auth.signOut(); throw errCode('NO_ADMIN'); }
    },
    async sesion() {
      const { data } = await sb.auth.getSession();
      if (!data.session) return false;
      const { data: es } = await sb.rpc('es_admin');
      return !!es;
    },
    async logout() { await sb.auth.signOut(); },
    async todo() {
      const [d, i, r, ep, le, tx] = await Promise.all([
        sb.from('desayunos').select('*').order('fecha'),
        sb.from('inscripciones').select('*').order('created_at'),
        sb.from('reuniones').select('*').order('created_at', { ascending: false }),
        sb.from('eventos_privados').select('*').order('created_at', { ascending: false }),
        sb.from('lista_espera').select('*').order('created_at'),
        sb.from('textos').select('*')
      ]);
      return { desayunos: ok(d), inscripciones: ok(i), reuniones: ok(r), eventos: ok(ep), espera: ok(le), textos: ok(tx) };
    },
    async crearDesayuno(x) { ok(await sb.from('desayunos').insert(x)); },
    async actualizarDesayuno(id, c) { ok(await sb.from('desayunos').update(c).eq('id', id)); },
    async borrarDesayuno(id) { ok(await sb.from('desayunos').delete().eq('id', id)); },
    async borrarInscripcion(id) { ok(await sb.from('inscripciones').delete().eq('id', id)); },
    async actualizarReunion(id, c) { ok(await sb.from('reuniones').update(c).eq('id', id)); },
    async borrarReunion(id) { ok(await sb.from('reuniones').delete().eq('id', id)); },
    async actualizarEvento(id, c) { ok(await sb.from('eventos_privados').update(c).eq('id', id)); },
    async borrarEvento(id) { ok(await sb.from('eventos_privados').delete().eq('id', id)); },
    async actualizarInscripcion(id, c) { ok(await sb.from('inscripciones').update(c).eq('id', id)); },
    async moverEspera(e) {
      const { id, created_at, ...datos } = e;
      ok(await sb.from('inscripciones').insert(datos));
      ok(await sb.from('lista_espera').delete().eq('id', id));
    },
    async borrarEspera(id) { ok(await sb.from('lista_espera').delete().eq('id', id)); },
    async guardarTexto(clave, v) { ok(await sb.from('textos').upsert({ clave, ...v, updated_at: new Date().toISOString() })); },
    async borrarTexto(clave) { ok(await sb.from('textos').delete().eq('clave', clave)); }
  };
}

    const opcionesInv = [...CONFIG.COMERCIALES, OTRO, null];
    const ins = [];
    const llenar = (evento, n) => {
      for (let k = 0; k < n; k++) {
        const part = k % 7 === 6;
        const nom = nombres[(k * 3 + n) % nombres.length], ape = apellidos[(k * 7) % apellidos.length];
        ins.push({
          id: uid(), desayuno_id: evento.id, tipo: part ? 'particular' : 'empresa',
          empresa: part ? null : empresas[Math.floor(k / 2) % empresas.length],
          cargo: part ? null : cargos[k % cargos.length],
          nombre: nom, apellido: ape,
          email: `${norm(nom)}.${norm(ape)}${k}@exemple.com`.normalize('NFD').replace(/[\u0300-\u036f]/g, ''),
          telefono: '+34 6' + String(10000000 + k * 371).slice(0, 8),
          producto: PRODUCTOS[(k * 5 + n) % PRODUCTOS.length],
          comercial: opcionesInv[k % opcionesInv.length], asistentes: 1,
          created_at: new Date(Date.now() - (n - k) * 36e5 * 5).toISOString()
        });
      }
    };
    llenar(ev[0], 25); llenar(ev[1], 19); llenar(ev[2], 4);
    const reu = [
      { id: uid(), tipo: 'empresa', empresa: 'Nexa Energia', cargo: 'Directora general', nombre: 'Laia', apellido: 'Bosch', email: 'laia.bosch@exemple.com', telefono: '+34 612 334 556', producto: 'Balcony', comercial: null, franja: 'mananas', comentarios: 'Busquem 8 places per a clients.', estado: 'pendiente', created_at: new Date(Date.now() - 864e5).toISOString() },
      { id: uid(), tipo: 'particular', empresa: null, cargo: null, nombre: 'Joan', apellido: 'Prat', email: 'joan.prat@exemple.com', telefono: '+34 699 120 004', producto: 'Pitch Row', comercial: CONFIG.COMERCIALES[2], franja: 'tardes', comentarios: '', estado: 'contactado', created_at: new Date(Date.now() - 4 * 864e5).toISOString() }
    ];
    const evp = [
      { id: uid(), tipo: 'empresa', empresa: 'Banca Litoral', cargo: 'Directora de relacions institucionals', nombre: 'Carla', apellido: 'Mir', email: 'carla.mir@exemple.com', telefono: '+34 655 210 330', producto: null, comercial: CONFIG.COMERCIALES[0], tipo_evento: 'desayuno', invitados: 14, fecha_preferida: 'Finals de novembre', comentarios: 'Clients de banca privada, amb visita a l’estadi si és possible.', estado: 'pendiente', created_at: new Date(Date.now() - 2 * 864e5).toISOString() }
    ];
    return { desayunos: ev, inscripciones: ins, reuniones: reu, eventos: evp };
  }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) {} };
  const load = () => {
    if (mem) return mem;
    try { mem = JSON.parse(localStorage.getItem(KEY)); } catch (e) { mem = null; }
    if (!mem || !Array.isArray(mem.desayunos)) { mem = semilla(); save(); }
    if (!Array.isArray(mem.eventos)) { mem.eventos = []; save(); }
    if (!Array.isArray(mem.espera)) { mem.espera = []; save(); }
    if (!Array.isArray(mem.textos)) { mem.textos = []; save(); }
    return mem;
  };
  const clon = x => JSON.parse(JSON.stringify(x));
  return {
    async disponibles() {
      const d = load(), desde = hoyISO().slice(0, 8) + '01';
      return d.desayunos.filter(x => x.activo && x.fecha >= desde)
        .sort((a, b) => a.fecha.localeCompare(b.fecha))
        .map(x => ({ inscripciones_abiertas: true, max_por_empresa: CONFIG.MAX_POR_EMPRESA, ...x, ocupadas: plazas(d.inscripciones.filter(i => i.desayuno_id === x.id)) }));
    },
    async inscribir(n, esAdmin = false) {
      const d = load(); const ev = d.desayunos.find(x => x.id === n.desayuno_id);
      if (!ev || !ev.activo) throw errCode('DESAYUNO_NO_DISPONIBLE');
      if (ev.inscripciones_abiertas === false && !esAdmin) throw errCode('INSCRIPCIONES_CERRADAS');
      if (ev.fecha < hoyISO()) throw errCode('DESAYUNO_PASADO');
      const ins = d.inscripciones.filter(i => i.desayuno_id === ev.id);
      const ocup = plazas(ins), pide = n.asistentes || 1;
      if (ocup >= ev.aforo) throw errCode('AFORO_COMPLETO');
      if (ocup + pide > ev.aforo) throw errCode('PLAZAS_INSUFICIENTES');
      if (ins.some(i => i.email === n.email)) throw errCode('DUPLICADO');
      if (n.tipo === 'empresa' && plazas(ins.filter(i => i.tipo === 'empresa' && norm(i.empresa) === norm(n.empresa))) + pide > (ev.max_por_empresa || CONFIG.MAX_POR_EMPRESA)) throw errCode('LIMITE_EMPRESA');
      d.inscripciones.push({ ...n, id: uid(), created_at: new Date().toISOString() }); save();
    },
    async reunion(n) { const d = load(); d.reuniones.unshift({ ...n, id: uid(), estado: 'pendiente', created_at: new Date().toISOString() }); save(); },
    async login(email, pw) { if (!email || !pw) throw errCode('LOGIN'); logueado = true; },
    async sesion() { return logueado; },
    async logout() { logueado = false; },
    async todo() { return clon(load()); },
    async crearDesayuno(x) { const d = load(); d.desayunos.push({ ...x, id: uid(), activo: true }); save(); },
    async actualizarDesayuno(id, c) { const d = load(); Object.assign(d.desayunos.find(x => x.id === id) || {}, c); save(); },
    async borrarDesayuno(id) { const d = load(); d.desayunos = d.desayunos.filter(x => x.id !== id); d.inscripciones = d.inscripciones.filter(i => i.desayuno_id !== id); d.espera = d.espera.filter(i => i.desayuno_id !== id); save(); },
    async borrarInscripcion(id) { const d = load(); d.inscripciones = d.inscripciones.filter(i => i.id !== id); save(); },
    async actualizarReunion(id, c) { const d = load(); Object.assign(d.reuniones.find(x => x.id === id) || {}, c); save(); },
    async borrarReunion(id) { const d = load(); d.reuniones = d.reuniones.filter(x => x.id !== id); save(); },
    async evento(n) { const d = load(); d.eventos.unshift({ ...n, id: uid(), estado: 'pendiente', created_at: new Date().toISOString() }); save(); },
    async actualizarEvento(id, c) { const d = load(); Object.assign(d.eventos.find(x => x.id === id) || {}, c); save(); },
    async borrarEvento(id) { const d = load(); d.eventos = d.eventos.filter(x => x.id !== id); save(); },
    async unirseEspera(n) {
      const d = load(); const ev = d.desayunos.find(x => x.id === n.desayuno_id);
      if (!ev || !ev.activo) throw errCode('DESAYUNO_NO_DISPONIBLE');
      if (ev.inscripciones_abiertas === false) throw errCode('INSCRIPCIONES_CERRADAS');
      if (ev.fecha < hoyISO()) throw errCode('DESAYUNO_PASADO');
      if (d.espera.some(x => x.desayuno_id === ev.id && x.email === n.email)) throw errCode('DUPLICADO');
      d.espera.push({ ...n, id: uid(), created_at: new Date().toISOString() }); save();
    },
    async textos() { return clon(load().textos); },
    async actualizarInscripcion(id, c) { const d = load(); Object.assign(d.inscripciones.find(x => x.id === id) || {}, c); save(); },
    async moverEspera(e) {
      const { id, created_at, ...datos } = e;
      await this.inscribir(datos, true);
      const d = load(); d.espera = d.espera.filter(x => x.id !== id); save();
    },
    async borrarEspera(id) { const d = load(); d.espera = d.espera.filter(x => x.id !== id); save(); },
    async guardarTexto(clave, v) { const d = load(); d.textos = d.textos.filter(x => x.clave !== clave).concat([{ clave, ...v }]); save(); },
    async borrarTexto(clave) { const d = load(); d.textos = d.textos.filter(x => x.clave !== clave); save(); }
  };
}

function prepararForm(form) {
  form.innerHTML = camposContacto(form.dataset.contacto);
  const sync = () => {
    const part = form.querySelector('input[name="tipo"]:checked').value === 'particular';
    form.classList.toggle('es-particular', part);
    form.querySelectorAll('.solo-empresa input').forEach(i => { i.disabled = part; });
  };
  form.addEventListener('change', e => { if (e.target.name === 'tipo') sync(); });
  sync();
}

function leerContacto(form) {
  const fd = new FormData(form);
  const tipo = fd.get('tipo');
  const v = k => (fd.get(k) || '').toString().trim();
  const com = v('comercial');
  return {
    tipo,
    empresa: tipo === 'empresa' ? v('empresa') : null,
    cargo: tipo === 'empresa' ? v('cargo') : null,
    nombre: v('nombre'),
    apellido: v('apellido'),
    email: v('email').toLowerCase(),
    telefono: v('telefono'),
    producto: v('producto') || null,
    comercial: !com || com === NADIE ? null : com
  };
}

function mostrarError(form, code) {
  const p = form.querySelector('[data-error]');
  p.dataset.code = code || '';
  p.textContent = code ? mensajeError(code) : '';
  p.hidden = !code;
}

async function cargarPublico() {
  try {
    state.desayunos = await api.disponibles();
    state.cargaError = false;
  } catch (e) {
    console.error(e);
    state.cargaError = true;
  }
  if (state.sel) state.sel = state.desayunos.find(d => d.id === state.sel.id) || state.sel;
  renderTickets();
  ajustarAsistentes();
}

function ticketHTML(d, sel = false) {
  const pct = Math.min(100, Math.round((d.ocupadas / d.aforo) * 100));
  const lleno = d.ocupadas >= d.aforo;
  const pasado = d.fecha < hoyISO();
  const abierta = d.inscripciones_abiertas !== false;
  const espera = lleno && !pasado && abierta;          // completa però s'admet llista d'espera
  const cerrado = pasado || !abierta;                   // no es pot seleccionar
  const libres = Math.max(0, d.aforo - d.ocupadas);
  const cls = ['ticket', (lleno || cerrado) ? 'full' : '', sel ? 'sel' : '', !lleno && pct >= 80 ? 'casi' : ''].join(' ');
  const resto = lleno ? t('complete') : cerrado ? t('closed') : libres === 1 ? t('left_1') : t('left_n', { n: libres });
  const cta = pasado ? (lleno ? t('no_seats') : t('closed_cta')) : !abierta ? t('closed_cta') : sel ? t('chosen') : espera ? t('join_waitlist') : t('choose');
  const color = colorValido(d.color);
  const titulo = tituloDe(d);
  return `
    <button type="button" class="${cls}" data-id="${esc(d.id || '')}" ${cerrado ? 'disabled' : ''} aria-pressed="${!!sel}"
      aria-label="${titulo ? esc(titulo) + ', ' : ''}${esc(cap(fechaLarga(d.fecha)))}, ${esc(t('occupied', { p: pct }))}, ${esc(resto)}">
      <span class="stub" style="--stub:${color};--stub-ink:${tintaSobre(color)}">
        <span class="wd">${esc(cap(fecha(d.fecha, { weekday: 'long' })))}</span>
        <span class="day">${esc(fecha(d.fecha, { day: 'numeric' }))}</span>
        <span class="mo">${esc(fecha(d.fecha, { month: 'short' }).replace('.', ''))} ${esc(fecha(d.fecha, { year: '2-digit' }))}</span>
      </span>
      <span class="tbody">
        <span class="tmeta">${titulo ? `<span class="ttitle">${esc(titulo)}</span>` : ''}<strong>${esc(t('time_range', { a: hora(d.hora_inicio), b: hora(d.hora_fin) }))}</strong><span>${esc(d.lugar)}</span></span>
        <span>
          <span class="bar"><i style="width:${pct}%"></i></span>
          <span class="aforo-txt"><strong>${esc(t('occupied', { p: pct }))}</strong><span>${esc(resto)}</span></span>
        </span>
        <span class="tcta">${esc(cta)}</span>
      </span>
    </button>`;
}

function renderTickets() {
  const el = $('#tickets');
  if (state.cargaError) { el.innerHTML = `<p class="empty">${esc(t('dates_error'))}</p>`; return; }
  if (!state.desayunos.length) { el.innerHTML = `<p class="empty">${esc(t('no_dates'))}</p>`; return; }
  el.innerHTML = state.desayunos.map(d => ticketHTML(d, state.sel && state.sel.id === d.id)).join('');
}

const modoEspera = () => !!state.sel && state.sel.ocupadas >= state.sel.aforo;

function ajustarAsistentes() {
  const form = $('#formInscripcion');
  const sel = form && form.querySelector('select[name="asistentes"]');
  if (!sel || !state.sel) return;
  const libres = state.sel.aforo - state.sel.ocupadas;
  const esEmpresa = (form.querySelector('input[name="tipo"]:checked') || {}).value === 'empresa';
  const maxEmpresa = state.sel.max_por_empresa || CONFIG.MAX_POR_EMPRESA;
  const op2 = sel.querySelector('option[value="2"]');
  op2.disabled = (!modoEspera() && libres < 2) || (esEmpresa && maxEmpresa < 2);
  if (op2.disabled && sel.value === '2') sel.value = '1';
}

function renderNotaFecha() {
  ajustarAsistentes();
  if (!state.sel) return;
  const d = state.sel;
  $('#fechaElegida').innerHTML = modoEspera()
    ? t('waitlist_note', { date: esc(fechaLarga(d.fecha)) })
    : t('chosen_note', { date: esc(fechaLarga(d.fecha)), a: esc(hora(d.hora_inicio)), b: esc(hora(d.hora_fin)), place: esc(d.lugar) });
  const btn = $('#formInscripcion button[type="submit"]');
  if (btn && !btn.disabled) { btn.dataset.i18n = modoEspera() ? 'btn_waitlist' : 'btn_reserve'; btn.textContent = t(btn.dataset.i18n); }
}
document.addEventListener('change', e => { if (e.target.name === 'tipo' && e.target.closest('#formInscripcion')) ajustarAsistentes(); });

$('#tickets').addEventListener('click', e => {
  const b = e.target.closest('.ticket');
  if (!b || b.disabled) return;
  state.sel = state.desayunos.find(d => d.id === b.dataset.id);

});

async function enviarEvento(e) {
  e.preventDefault();
  const form = e.currentTarget;
  const btn = form.querySelector('button[type="submit"]');
  const fd = new FormData(form);
  const datos = {
    ...leerContacto(form),
    tipo_evento: fd.get('tipo_evento'),
    invitados: parseInt(fd.get('invitados'), 10) || null,
    fecha_preferida: (fd.get('fecha_preferida') || '').toString().trim() || null,
    comentarios: (fd.get('comentarios') || '').toString().trim() || null,
    estado: 'pendiente'
  };
  btn.disabled = true; btn.textContent = t('btn_sending'); mostrarError(form, '');
  try {
    await api.evento(datos);
    state.confEvt = datos;
    renderConfirmEvt();
  } catch (err) {
    console.error(err);
    mostrarError(form, codigoDe(err));
    btn.disabled = false; btn.textContent = t('btn_event');
  }
}

async function enviarInscripcion(e) {
  e.preventDefault();
  const form = e.currentTarget;
  if (!state.sel) { mostrarError(form, 'SIN_FECHA'); return; }
  const btn = form.querySelector('button[type="submit"]');
  const datos = { ...leerContacto(form), desayuno_id: state.sel.id, asistentes: parseInt(new FormData(form).get('asistentes'), 10) === 2 ? 2 : 1 };
  const espera = modoEspera();
  btn.disabled = true; btn.textContent = t(espera ? 'btn_sending' : 'btn_reserving'); mostrarError(form, '');
  try {
    if (espera) await api.unirseEspera(datos); else await api.inscribir(datos);
    state.confIns = { ...datos, ev: state.sel, espera };
    renderConfirmIns();
    $('#paso2').scrollIntoView({ block: 'start' });
    cargarPublico();
  } catch (err) {
    console.error(err);
    let code = codigoDe(err);
    if (espera && code === 'DUPLICADO') code = 'DUPLICADO_ESPERA';
    mostrarError(form, code);
    btn.disabled = false; btn.textContent = t(espera ? 'btn_waitlist' : 'btn_reserve');
    if (['AFORO_COMPLETO', 'PLAZAS_INSUFICIENTES', 'INSCRIPCIONES_CERRADAS'].includes(code)) cargarPublico().then(renderNotaFecha);
  }
}

async function enviarReunion(e) {
  e.preventDefault();
  const form = e.currentTarget;
  const btn = form.querySelector('button[type="submit"]');
  const fd = new FormData(form);
  const datos = { ...leerContacto(form), franja: fd.get('franja') || null, comentarios: (fd.get('comentarios') || '').toString().trim() || null, estado: 'pendiente' };
  btn.disabled = true; btn.textContent = t('btn_sending'); mostrarError(form, '');
  try {
    await api.reunion(datos);
    state.confReu = datos;
    renderConfirmReu();
  } catch (err) {
    console.error(err);
    mostrarError(form, codigoDe(err));
    btn.disabled = false; btn.textContent = t('btn_request');
  }
}

const insDe = id => D.inscripciones.filter(i => i.desayuno_id === id);
const plazasDe = id => plazas(insDe(id));
const tipoBadge = () => `<span class="badge">${esc(t('individual'))}</span>`;

function renderKpis() {
  const hoy = hoyISO();
  const prox = D.desayunos.filter(d => d.activo && d.fecha >= hoy).sort((a, b) => a.fecha.localeCompare(b.fecha));
  const p = prox[0];
  const futurosIds = new Set(D.desayunos.filter(d => d.fecha >= hoy).map(d => d.id));
  const inscritosFut = plazas(D.inscripciones.filter(i => futurosIds.has(i.desayuno_id)));
  const pend = [...D.reuniones, ...D.eventos].filter(r => r.estado === 'pendiente').length;
  const cuenta = {};
  [...D.inscripciones, ...D.reuniones, ...D.eventos].filter(x => x.producto).forEach(x => { cuenta[x.producto] = (cuenta[x.producto] || 0) + 1; });
  const top = Object.entries(cuenta).sort((a, b) => b[1] - a[1])[0];
  $('#kpis').innerHTML = `
    <div class="kpi"><b>${p ? `${plazasDe(p.id)}/${p.aforo}` : esc(t('kpi_none'))}</b><span>${esc(p ? t('kpi_next', { date: fecha(p.fecha, { day: 'numeric', month: 'long' }) }) : t('kpi_create'))}</span></div>
    <div class="kpi"><b>${inscritosFut}</b><span>${esc(t('kpi_signed'))}</span></div>
    <div class="kpi"><b>${pend}</b><span>${esc(t('kpi_pending'))}</span></div>
    <div class="kpi"><b>${top ? esc(top[0]) : esc(t('kpi_nodata'))}</b><span>${esc(t('kpi_top'))}${top ? ` (${top[1]})` : ''}</span></div>`;
}

/* ---------- CSV ---------- */
function descargarCSV(nombre, filas, cols) {
  const limpiar = v => { let s = String(v ?? ''); if (/^[=@]/.test(s) || /^[+-][^0-9 ]/.test(s)) s = "'" + s; return /[";\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const txt = '\ufeff' + [cols.map(c => limpiar(c[0])).join(';'), ...filas.map(f => cols.map(c => limpiar(typeof c[1] === 'function' ? c[1](f) : f[c[1]])).join(';'))].join('\r\n');
  const url = URL.createObjectURL(new Blob([txt], { type: 'text/csv;charset=utf-8' }));
  const a = document.createElement('a'); a.href = url; a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

document.addEventListener('click', async e => {
  const langBtn = e.target.closest('[data-lang]');
  if (langBtn) { cambiarIdioma(langBtn.dataset.lang); return; }
  const tab = e.target.closest('.tab');
  if (tab) { adminState.tab = tab.dataset.tab; renderTab(); return; }
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const id = b.dataset.id;
  try {
    switch (b.dataset.act) {
      case 'refrescar': await cargarAdmin(); toast(t('t_updated')); break;
      case 'logout': await api.logout(); D = null; initAdmin(); break;
      case 'csv-ev': { const ev = evPorId(id); descargarCSV(`esmorzar-${ev.fecha}.csv`, insDe(id), colsIns()); break; }
      case 'csv-all': descargarCSV(`inscripcions-esmorzars-${hoyISO()}.csv`, [...D.inscripciones].sort((a, b) => (evPorId(a.desayuno_id)?.fecha || '').localeCompare(evPorId(b.desayuno_id)?.fecha || '')), colsIns()); break;
      case 'csv-sol': {
        const k = b.dataset.kind;
        descargarCSV(`${k === 'eventos' ? 'esdeveniments-privats' : 'reunions-privades'}-${hoyISO()}.csv`, listaFiltrada(k), k === 'eventos' ? colsEvt() : colsReu());
        break;
      }
      case 'del-ins': {
        const i = D.inscripciones.find(x => x.id === id);
        if (!confirm(t('c_del_ins', { name: `${i.nombre} ${i.apellido}` }))) return;
        await api.borrarInscripcion(id); await cargarAdmin(); toast(t('t_ins_deleted')); break;
      }
      case 'del-sol': {
        const k = b.dataset.kind;
        if (!confirm(t(k === 'eventos' ? 'c_del_evt' : 'c_del_reu'))) return;
        await (k === 'eventos' ? api.borrarEvento(id) : api.borrarReunion(id));
        await cargarAdmin(); toast(t('t_req_deleted')); break;
      }
      case 'toggle-ev': {
        const ev = evPorId(id);
        await api.actualizarDesayuno(id, { activo: !ev.activo }); await cargarAdmin();
        toast(t(ev.activo ? 't_hidden' : 't_shown')); break;
      }
      case 'asis': {
        const i = D.inscripciones.find(x => x.id === id);
        const v = b.dataset.v === '1';
        const nuevo = i.asistio === v ? null : v;   // tornar a clicar desmarca
        await api.actualizarInscripcion(id, { asistio: nuevo }); i.asistio = nuevo; renderTab(); break;
      }
      case 'toggle-ins': {
        const ev = evPorId(id);
        const abrir = ev.inscripciones_abiertas === false;
        await api.actualizarDesayuno(id, { inscripciones_abiertas: abrir }); await cargarAdmin();
        toast(t(abrir ? 't_regs_open' : 't_regs_closed')); break;
      }
      case 'mover-esp': {
        const e = D.espera.find(x => x.id === id);
        try { await api.moverEspera(e); }
        catch (x) {
          console.error(x); const c = codigoDe(x);
          toast(['AFORO_COMPLETO', 'PLAZAS_INSUFICIENTES'].includes(c) ? t('t_move_full') : mensajeError(c)); return;
        }
        await cargarAdmin(); toast(t('t_moved')); break;
      }
      case 'del-esp': {
        if (!confirm(t('c_del_esp'))) return;
        await api.borrarEspera(id); await cargarAdmin(); toast(t('t_esp_deleted')); break;
      }
      case 'save-txt': {
        const k = b.dataset.k, card = b.closest('.txt-card');
        const v = {}; card.querySelectorAll('textarea[data-txt]').forEach(ta => { v[ta.dataset.lg] = ta.value.trim() || null; });
        if (!v.ca && !v.en && !v.es) await api.borrarTexto(k); else await api.guardarTexto(k, v);
        if (!v.ca && !v.en && !v.es) delete TEXTOS[k]; else TEXTOS[k] = v;
        delete adminState.txtDraft[k];
        aplicarIdioma(); toast(t('t_txt_saved')); break;
      }
      case 'reset-txt': {
        const k = b.dataset.k;
        if (!confirm(t('c_txt_reset'))) return;
        await api.borrarTexto(k); delete TEXTOS[k]; delete adminState.txtDraft[k];
        aplicarIdioma(); toast(t('t_txt_reset')); break;
      }
      case 'edit-ev': case 'dup-ev': {
        const ev = evPorId(id);
        const copia = { ...borradorNuevo(), ...ev, hora_inicio: hora(ev.hora_inicio), hora_fin: hora(ev.hora_fin),
          titulo_ca: ev.titulo_ca || '', titulo_en: ev.titulo_en || '', titulo_es: ev.titulo_es || '', color: colorValido(ev.color),
          max_por_empresa: ev.max_por_empresa || CONFIG.MAX_POR_EMPRESA, inscripciones_abiertas: ev.inscripciones_abiertas !== false };
        if (b.dataset.act === 'dup-ev') { copia.id = null; copia.fecha = ''; toast(t('t_dup')); }
        adminState.borrador = copia; renderTab();
        $('#cardFecha').scrollIntoView({ block: 'start' });
        break;
      }
      case 'cancel-ev': adminState.borrador = borradorNuevo(); renderTab(); break;
      case 'del-ev': {
        const n = plazasDe(id);
        if (!confirm(n ? t('c_del_ev_n', { n }) : t('c_del_ev'))) return;
        await api.borrarDesayuno(id);
        if (adminState.borrador && adminState.borrador.id === id) adminState.borrador = borradorNuevo();
        await cargarAdmin(); toast(t('t_ev_deleted')); break;
      }
    }
  } catch (x) { console.error(x); toast(t('t_action_error')); }
});

document.addEventListener('change', async e => {
  const s = e.target;
  if (s.matches('select[data-filtro="estado"]')) { adminState.filtro[s.dataset.kind] = s.value; renderTab(); return; }
  if (s.matches('select[data-sol]')) {
    const id = s.dataset.sol, kind = s.dataset.kind, campo = s.dataset.campo, valor = s.value || null;
    s.disabled = true;
    try {
      await (kind === 'eventos' ? api.actualizarEvento(id, { [campo]: valor }) : api.actualizarReunion(id, { [campo]: valor }));
      const r = D[kind].find(x => x.id === id); if (r) r[campo] = valor;
      if (campo === 'estado') s.classList.toggle('st-pendiente', valor === 'pendiente');
      renderKpis(); toast(t('t_saved'));
    } catch (x) { console.error(x); toast(t('t_save_error')); }
    finally { s.disabled = false; }
  }
});

// Vista prèvia en directe i borrador (es conserva si es canvia d'idioma)
['input', 'change'].forEach(tipo => document.addEventListener(tipo, e => {
  const form = e.target.closest && e.target.closest('#formFecha');
  if (!form) return;
  if (e.target.name === 'color_custom') form.querySelector('input[name="color_sw"][value="custom"]').checked = true;
  adminState.borrador = borradorDesdeForm(form);
  $('#previewEv').innerHTML = previewHTML(adminState.borrador);
}));

document.addEventListener('submit', async e => {
  if (e.target.id !== 'formFecha') return;
  e.preventDefault();
  const b = borradorDesdeForm(e.target);
  if (b.hora_fin <= b.hora_inicio) { toast(t('t_end_after')); return; }
  if (b.id && b.aforo < plazasDe(b.id)) { toast(t('t_aforo_low', { n: plazasDe(b.id) })); return; }
  const datos = {
    fecha: b.fecha, hora_inicio: b.hora_inicio, hora_fin: b.hora_fin, lugar: b.lugar, aforo: b.aforo,
    titulo_ca: b.titulo_ca || null, titulo_en: b.titulo_en || null, titulo_es: b.titulo_es || null, color: b.color,
    max_por_empresa: b.max_por_empresa, inscripciones_abiertas: b.inscripciones_abiertas
  };
  const btn = e.target.querySelector('button[type="submit"]'); btn.disabled = true;
  try {
    if (b.id) await api.actualizarDesayuno(b.id, datos); else await api.crearDesayuno(datos);
    adminState.borrador = borradorNuevo();
    await cargarAdmin(); toast(t(b.id ? 't_saved_ev' : 't_added'));
  } catch (x) { console.error(x); toast(t('t_create_error')); btn.disabled = false; }
});

/* =====================================================================
   IDIOMA
   ===================================================================== */
function aplicarIdioma() {
  document.documentElement.lang = lang;
  document.title = t('doc_title');
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = tHtml(el.dataset.i18nHtml); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = t(el.dataset.i18nTitle); });
  document.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
  document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  document.querySelectorAll('[data-error]').forEach(p => { if (p.dataset.code) p.textContent = mensajeError(p.dataset.code); });
  // Botons d'enviament que estiguin en procés conserven el seu estat
  document.querySelectorAll('form button[type="submit"]:disabled').forEach(b => {
    b.textContent = t(b.closest('#formReunion, #formEvento') ? 'btn_sending' : 'btn_reserving');
  });
  $('#loginNota').textContent = t(DEMO ? 'login_note_demo' : 'login_note');
  if (adminState.loginErr) $('#loginError').textContent = mensajeError(adminState.loginErr);
  if (state.desayunos.length || state.cargaError) renderTickets();
  renderNotaFecha();
  if (state.confIns && !$('#formInscripcion')) renderConfirmIns();
  if (state.confReu) renderConfirmReu();
  if (state.confEvt) renderConfirmEvt();
  if (D && !$('#adminPanel').hidden) { renderKpis(); renderTab(); }
}

function cambiarIdioma(nuevo) {
  if (!IDIOMAS.includes(nuevo) || nuevo === lang) return;
  lang = nuevo;
  try { localStorage.setItem('fcb_esmorzars_lang', lang); } catch (e) {}
  aplicarIdioma();
}

/* =====================================================================
   ARRENCADA
   ===================================================================== */
function route() {
  const admin = location.hash === '#admin';
  $('#vistaPublica').hidden = admin;
  $('#vistaAdmin').hidden = !admin;
  if (admin) initAdmin(); else cargarPublico();
  window.scrollTo(0, 0);
}
$('#demoBanner').hidden = !DEMO;
prepararForm($('#formInscripcion'));
$('#formInscripcion').addEventListener('submit', enviarInscripcion);
prepararForm($('#formReunion'));
$('#formReunion').addEventListener('submit', enviarReunion);
prepararForm($('#formEvento'));
$('#formEvento').addEventListener('submit', enviarEvento);
aplicarIdioma();
window.addEventListener('hashchange', route);
route();
api.textos().then(rows => { TEXTOS = Object.fromEntries((rows || []).map(r => [r.clave, r])); aplicarIdioma(); }).catch(e => console.error(e));
</script>
